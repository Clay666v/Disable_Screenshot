name: AndroidBuilder

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      # Changed from JDK 17 to JDK 11 to fix 'Unsupported class file major version 61' error
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Kept the memory limit and stacktrace flag to ensure we catch any other errors
      - name: Build with Gradle
        run: ./gradlew app:assembleRelease -Xmx2048m --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: ${{github.workspace}}/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 30
